<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="nexsoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#002D80" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>

  <!-- Left Pillar (Blue) -->
  <path d="M 50,40 L 80,40 L 80,160 L 50,160 Z" fill="url(#nexsoraGrad)" rx="4"/>
  
  <!-- Diagonal Connector (Circuit/Data Bridge) -->
  <path d="M 80,50 L 140,140 L 115,155 L 55,65 Z" fill="url(#nexsoraGrad)"/>
  
  <!-- Right Pillar (Orange Accent) -->
  <path d="M 120,40 L 150,40 L 150,160 L 120,160 Z" fill="url(#orangeGrad)" rx="4"/>
  
  <!-- Node Dots (EEE Circuit / Multi-tenant Nodes) -->
  <circle cx="50" cy="40" r="8" fill="#0052CC"/>
  <circle cx="150" cy="160" r="8" fill="#FF7A00"/>
  <circle cx="150" cy="40" r="8" fill="#FF7A00"/>

  <!-- Company Text -->
  <text x="185" y="115" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="800" font-size="52" fill="#0A2540" letter-spacing="3">NEXSORA</text>

  <!-- Tagline Text -->
  <text x="188" y="148" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="700" font-size="14" fill="#FF7A00" letter-spacing="4.5">INNOVATE • SOLVE • GROW</text>
</svg>
